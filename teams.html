<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Times — WZ Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
<script>(function(){if(!localStorage.getItem('wzc_user'))window.location.replace('login');})();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0f;color:#f0f2f5;font-family:'Barlow',sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:100;background:rgba(8,10,15,.96);border-bottom:1px solid rgba(255,106,0,.2);backdrop-filter:blur(12px)}
.hi{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:3px;display:flex;align-items:center;gap:10px}
.nav a{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;color:#8a96a8;padding:7px 12px;border-radius:6px;margin-left:4px;transition:.2s}
.nav a:hover{color:#ff6a00;background:rgba(255,106,0,.08)}
.page{padding:32px 0 80px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:4px;margin-bottom:4px}
h1 span{color:#ff6a00}
.sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:#4a5568;margin-bottom:28px}
.card{background:#111620;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:24px;margin-bottom:20px}
.ct{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:3px;color:#ff6a00;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:#4a5568}
input,select{background:#131820;border:1px solid rgba(255,255,255,.07);color:#f0f2f5;font-family:'Barlow',sans-serif;font-size:13px;padding:10px 14px;border-radius:8px;outline:none;transition:.2s;width:100%}
input:focus,select:focus{border-color:#ff6a00}
input::placeholder{color:#4a5568}
input[type=color]{padding:4px 8px;height:42px;cursor:pointer}
input[type=file]{padding:8px 12px}
.bp{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;padding:11px 22px;border-radius:8px;border:none;background:linear-gradient(135deg,#cc5500,#ff6a00);color:#fff;cursor:pointer;transition:.2s;white-space:nowrap}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,106,0,.35)}
.bs{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:9px 16px;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:#131820;color:#8a96a8;cursor:pointer;transition:.2s}
.bs:hover{border-color:#ff6a00;color:#ff6a00}
.bd{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 14px;border-radius:6px;border:1px solid rgba(255,45,85,.25);background:rgba(255,45,85,.08);color:#ff2d55;cursor:pointer;transition:.2s}
.bd:hover{background:rgba(255,45,85,.18)}
.bm{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 14px;border-radius:6px;border:1px solid rgba(79,172,254,.25);background:rgba(79,172,254,.08);color:#4facfe;cursor:pointer;transition:.2s}
.bm:hover{background:rgba(79,172,254,.18)}
.fb{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:6px;margin-top:10px}
.fb.ok{background:rgba(0,255,135,.1);border:1px solid rgba(0,255,135,.2);color:#00ff87}
.fb.er{background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.2);color:#ff2d55}
.tbn{display:flex;align-items:center;gap:16px;padding:16px;background:#0d1017;border-radius:10px;margin-bottom:16px}
.tli{border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.08)}
.tli img{width:100%;height:100%;object-fit:cover}
.mbr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0d1017;border-radius:8px;border:1px solid rgba(255,255,255,.05);margin-bottom:6px}
.mn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:1px}
.rb{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:20px;margin-left:8px}
.rc{background:rgba(255,215,0,.1);color:#ffd700;border:1px solid rgba(255,215,0,.25)}
.rm{background:rgba(79,172,254,.1);color:#4facfe;border:1px solid rgba(79,172,254,.25)}
.rp{background:rgba(255,255,255,.05);color:#4a5568;border:1px solid rgba(255,255,255,.07)}
.si{width:100%;padding:10px 14px;background:#131820;border:1px solid rgba(255,255,255,.07);color:#f0f2f5;font-family:'Barlow',sans-serif;font-size:13px;border-radius:8px;outline:none;transition:.2s;margin-bottom:16px}
.si:focus{border-color:#ff6a00}
.si::placeholder{color:#4a5568}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tc{background:#111620;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:18px;transition:.2s}
.tc:hover{border-color:rgba(255,106,0,.3);transform:translateY(-1px)}
.tc.mine{border-color:rgba(255,106,0,.5);background:rgba(255,106,0,.04)}
.em{text-align:center;padding:60px 20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;color:#4a5568}
details summary{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:#4a5568;cursor:pointer;padding:6px 0;user-select:none;list-style:none}
details summary:hover{color:#ff6a00}
details[open] summary{color:#ff6a00}
.toast{position:fixed;top:24px;right:24px;z-index:9999;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:14px 22px;border-radius:10px;backdrop-filter:blur(8px);transform:translateY(-80px);opacity:0;transition:.35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:rgba(0,255,135,.12);border:1px solid rgba(0,255,135,.25);color:#00ff87}
.toast.er{background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.25);color:#ff2d55}
</style>
</head>
<body>
<header><div class="w hi">
  <a class="logo" href="home">
    <svg width="30" height="30" viewBox="0 0 60 60" fill="none"><polygon points="30,2 56,16 56,44 30,58 4,44 4,16" stroke="#ff6a00" stroke-width="2" fill="none"/><circle cx="30" cy="30" r="3" fill="#ff6a00"/></svg>
    WZ CHAMPIONSHIP
  </a>
  <div class="nav" style="display:flex;align-items:center">
    <a href="home">🏠 INÍCIO</a>
    <a href="index">🏆 TORNEIOS</a>
    <a href="profile">👤 CONTA</a>
    <div id="hpill"></div>
  </div>
</div></header>

<div class="page"><div class="w">
  <h1>TIMES <span>WZ</span></h1>
  <div class="sub">GERENCIE SEU TIME — 1 TIME POR CONTA</div>

  <!-- SEM TIME -->
  <div id="v-notm" style="display:none">
    <div class="card">
      <div class="em">🎮<br><br>VOCÊ NÃO TEM UM TIME
        <br><small style="font-family:'Barlow',sans-serif;font-size:12px;color:#4a5568;display:block;margin:8px 0 16px">Crie seu time para participar dos campeonatos</small>
        <button class="bp" onclick="showCreate()">+ CRIAR TIME</button>
      </div>
    </div>
  </div>

  <!-- CRIAR TIME -->
  <div id="v-crt" style="display:none">
    <div class="card">
      <div class="ct">🛡 CRIAR NOVO TIME</div>
      <div class="row">
        <div class="fg"><label>NOME DO TIME *</label><input id="cn" placeholder="Ex: OpTic Gaming"/></div>
        <div class="fg"><label>TAG (máx. 5) *</label><input id="ctg" maxlength="5" placeholder="OPT"/></div>
        <div class="fg"><label>COR</label><input type="color" id="cc" value="#ff6a00"/></div>
        <div class="fg"><label>LOGO</label>
          <input type="file" id="cl" accept="image/*" onchange="prvL(this)"/>
          <img id="lp" style="display:none;max-width:70px;border-radius:8px;margin-top:6px"/>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="bp" onclick="createTeam()">CRIAR TIME</button>
        <button class="bs" onclick="showNotm()">CANCELAR</button>
      </div>
      <div id="cfb" style="display:none" class="fb"></div>
    </div>
  </div>

  <!-- MEU TIME -->
  <div id="v-team" style="display:none">
    <div class="card">
      <div class="ct">⭐ MEU TIME</div>
      <div class="tbn" id="tbanner"></div>
      <details id="edet">
        <summary>⚙ EDITAR TIME</summary>
        <div style="margin-top:14px">
          <div class="row">
            <div class="fg"><label>NOME</label><input id="en"/></div>
            <div class="fg"><label>TAG</label><input id="et" maxlength="5"/></div>
            <div class="fg"><label>COR</label><input type="color" id="ec"/></div>
            <div class="fg"><label>LOGO</label><input type="file" id="el" accept="image/*"/></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="bp" onclick="editTeam()">SALVAR</button>
            <button class="bd" onclick="delTeam()">🗑 EXCLUIR TIME</button>
          </div>
          <div id="efb" style="display:none" class="fb"></div>
        </div>
      </details>
    </div>
    <div class="card" id="cmemb"></div>
  </div>

  <!-- TODOS OS TIMES -->
  <div class="card">
    <div class="ct">🔍 TODOS OS TIMES</div>
    <input class="si" id="srch" placeholder="Buscar por nome, tag, dono ou integrante..." oninput="filterTeams()"/>
    <div id="tgrid"><div class="em">Carregando...</div></div>
  </div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const TK=()=>localStorage.getItem('wzc_token');
const ME=()=>{try{return JSON.parse(localStorage.getItem('wzc_user')||'{}')}catch{return{}}};
let myTeam=null,allTeams=[];

// header
(function(){
  const u=ME(),el=document.getElementById('hpill');
  if(el&&u.nickname)el.innerHTML='<div style="background:rgba(255,106,0,.1);border:1px solid rgba(255,106,0,.2);border-radius:20px;padding:5px 12px;font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:#00ff87;display:inline-block"></span>'+u.nickname+'</div>';
})();

function toast(m,tp){
  var el=document.getElementById('toast');
  el.textContent=m;el.className='toast '+(tp||'ok')+' show';
  setTimeout(function(){el.classList.remove('show')},3500);
}
function setFb(id,m,tp){
  var el=document.getElementById(id);
  el.textContent=m;el.className='fb '+(tp||'er');el.style.display='block';
}
function hideFb(id){document.getElementById(id).style.display='none'}

async function api(method,path,body,isForm){
  var opts={method:method,headers:{Authorization:'Bearer '+TK()}};
  if(isForm){opts.body=body}
  else if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
  var r=await fetch('/api'+path,opts),d=await r.json();
  if(!r.ok)throw new Error(d.error||'Erro');
  return d;
}

function showNotm(){
  document.getElementById('v-notm').style.display='block';
  document.getElementById('v-crt').style.display='none';
  document.getElementById('v-team').style.display='none';
}
function showCreate(){
  document.getElementById('v-notm').style.display='none';
  document.getElementById('v-crt').style.display='block';
  document.getElementById('v-team').style.display='none';
}
function prvL(i){
  var p=document.getElementById('lp');
  if(i.files[0]){p.src=URL.createObjectURL(i.files[0]);p.style.display='block'}
}

function logoEl(t,sz){
  sz=sz||44;
  if(t.logo)return '<div class="tli" style="width:'+sz+'px;height:'+sz+'px"><img src="'+t.logo+'"/></div>';
  return '<div class="tli" style="width:'+sz+'px;height:'+sz+'px;background:'+(t.color||'#ff6a00')+'">'+(t.tag||'?').slice(0,2)+'</div>';
}

function renderMyTeam(t){
  myTeam=t;
  document.getElementById('v-notm').style.display='none';
  document.getElementById('v-crt').style.display='none';
  document.getElementById('v-team').style.display='block';
  document.getElementById('en').value=t.name;
  document.getElementById('et').value=t.tag;
  document.getElementById('ec').value=t.color||'#ff6a00';
  var me=ME(),canEdit=t.ownerId===me.id||t.members.some(function(m){return m.userId===me.id&&m.role==='manager'});
  document.getElementById('edet').style.display=canEdit?'':'none';
  document.getElementById('tbanner').innerHTML=logoEl(t,60)+
    '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;color:#ff6a00">['+t.tag+']</div>'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;letter-spacing:2px">'+t.name+'</div>'+
    '<div style="font-size:12px;color:#4a5568;margin-top:4px">Cap: '+t.ownerNick+' &nbsp;·&nbsp; '+t.members.length+'/'+t.memberLimit+' membros</div></div>';
  var isCap=t.ownerId===me.id;
  var mhtml='<div class="ct">MEMBROS ('+t.members.length+'/'+t.memberLimit+')</div>';
  if(canEdit)mhtml+='<div class="row" style="margin-bottom:12px"><div class="fg"><label>ADICIONAR MEMBRO (nickname)</label><input id="addnick" placeholder="Nickname do jogador"/></div><button class="bp" style="margin-top:auto" onclick="addMember()">+ ADD</button></div><div id="mfb" style="display:none" class="fb"></div>';
  t.members.forEach(function(m){
    var isMeCap=m.userId===t.ownerId,isMe=m.userId===me.id;
    var lbl=isMeCap?'CAPITÃO':m.role==='manager'?'GERENTE':'JOGADOR';
    var cls=isMeCap?'rc':m.role==='manager'?'rm':'rp';
    var acts='';
    if(isCap&&!isMeCap){
      if(m.role==='manager')acts+='<button class="bs" style="padding:4px 10px;font-size:10px;margin-right:4px" onclick="setRole(\''+m.userId+'\',\'player\')">↓ JOGADOR</button>';
      else acts+='<button class="bm" style="padding:4px 10px;font-size:10px;margin-right:4px" onclick="setRole(\''+m.userId+'\',\'manager\')">⬆ GERENTE</button>';
      acts+='<button class="bd" style="padding:4px 10px;font-size:10px" onclick="remMember(\''+m.userId+'\')">✕</button>';
    }else if(isMe&&!isMeCap){acts='<button class="bs" style="padding:4px 10px;font-size:10px" onclick="leaveTeam()">SAIR</button>'}
    mhtml+='<div class="mbr"><div style="display:flex;align-items:center"><span class="mn">'+m.nickname+'</span><span class="rb '+cls+'">'+lbl+'</span></div><div style="display:flex;gap:4px">'+acts+'</div></div>';
  });
  document.getElementById('cmemb').innerHTML=mhtml;
}

async function loadAll(){
  try{
    allTeams=await api('GET','/teams');
    var me=ME();
    myTeam=allTeams.find(function(t){return t.ownerId===me.id||t.members.some(function(m){return m.userId===me.id})})||null;
    if(myTeam)renderMyTeam(myTeam);else showNotm();
    filterTeams();
  }catch(e){toast(e.message,'er')}
}

function filterTeams(){
  var q=document.getElementById('srch').value.toLowerCase().trim();
  var grid=document.getElementById('tgrid');
  var list=allTeams;
  if(q)list=list.filter(function(t){
    return t.name.toLowerCase().includes(q)||t.tag.toLowerCase().includes(q)||
      (t.ownerNick||'').toLowerCase().includes(q)||
      t.members.some(function(m){return (m.nickname||'').toLowerCase().includes(q)});
  });
  if(!list.length){grid.innerHTML='<div class="em">Nenhum time encontrado</div>';return}
  var me=ME();
  var html='<div class="tg">';
  list.forEach(function(t){
    var mine=myTeam&&t.id===myTeam.id;
    html+='<div class="tc'+(mine?' mine':'')+'">';
    html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+logoEl(t,44);
    html+='<div style="flex:1"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px">'+t.name+'</div>';
    html+='<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;color:#ff6a00">['+t.tag+']</div></div>';
    if(mine)html+='<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:#ff6a00;padding:3px 10px;border-radius:20px;background:rgba(255,106,0,.1);border:1px solid rgba(255,106,0,.2)">MEU TIME</span>';
    html+='</div>';
    html+='<div style="font-size:11px;color:#4a5568;margin-bottom:6px">Cap: '+t.ownerNick+' &nbsp;·&nbsp; '+t.members.length+'/'+t.memberLimit+' membros</div>';
    html+='<div style="font-size:11px;color:#8a96a8">'+t.members.map(function(m){return m.nickname}).join(' &nbsp; ')+'</div>';
    html+='</div>';
  });
  html+='</div>';
  grid.innerHTML=html;
}

async function createTeam(){
  var n=document.getElementById('cn').value.trim(),tg=document.getElementById('ctg').value.trim();
  if(!n||!tg){setFb('cfb','Nome e tag são obrigatórios');return}
  var fd=new FormData();
  fd.append('name',n);fd.append('tag',tg);fd.append('color',document.getElementById('cc').value);
  var lf=document.getElementById('cl').files[0];if(lf)fd.append('logo',lf);
  try{var t=await api('POST','/teams',fd,true);toast('Time criado!');allTeams.push(t);renderMyTeam(t);filterTeams()}
  catch(e){setFb('cfb',e.message)}
}

async function editTeam(){
  var fd=new FormData();
  var n=document.getElementById('en').value.trim(),tg=document.getElementById('et').value.trim();
  if(n)fd.append('name',n);if(tg)fd.append('tag',tg);
  fd.append('color',document.getElementById('ec').value);
  var lf=document.getElementById('el').files[0];if(lf)fd.append('logo',lf);
  try{var t=await api('PATCH','/teams/'+myTeam.id,fd,true);toast('Atualizado!');allTeams=allTeams.map(function(x){return x.id===t.id?t:x});renderMyTeam(t);filterTeams()}
  catch(e){setFb('efb',e.message)}
}

async function delTeam(){
  if(!confirm('Excluir o time permanentemente?'))return;
  try{await api('DELETE','/teams/'+myTeam.id);toast('Time excluído','er');allTeams=allTeams.filter(function(t){return t.id!==myTeam.id});myTeam=null;showNotm();filterTeams()}
  catch(e){toast(e.message,'er')}
}

async function addMember(){
  var nick=document.getElementById('addnick').value.trim();
  if(!nick){setFb('mfb','Digite o nickname');return}
  try{var t=await api('POST','/teams/'+myTeam.id+'/members',{nickname:nick});toast(nick+' adicionado!');allTeams=allTeams.map(function(x){return x.id===t.id?t:x});renderMyTeam(t);filterTeams();document.getElementById('addnick').value=''}
  catch(e){setFb('mfb',e.message)}
}

async function remMember(uid){
  if(!confirm('Remover este membro?'))return;
  try{var t=await api('DELETE','/teams/'+myTeam.id+'/members/'+uid);toast('Membro removido');allTeams=allTeams.map(function(x){return x.id===t.id?t:x});renderMyTeam(t);filterTeams()}
  catch(e){toast(e.message,'er')}
}

async function leaveTeam(){
  if(!confirm('Sair do time?'))return;
  try{await api('DELETE','/teams/'+myTeam.id+'/members/'+ME().id);toast('Você saiu','er');allTeams=allTeams.filter(function(t){return t.id!==myTeam.id});myTeam=null;showNotm();await loadAll()}
  catch(e){toast(e.message,'er')}
}

async function setRole(uid,role){
  try{var t=await api('PATCH','/teams/'+myTeam.id+'/members/'+uid+'/role',{role:role});toast(role==='manager'?'Promovido a Gerente!':'Rebaixado a Jogador');allTeams=allTeams.map(function(x){return x.id===t.id?t:x});renderMyTeam(t)}
  catch(e){toast(e.message,'er')}
}

window.showCreate=showCreate;window.showNotm=showNotm;window.prvL=prvL;
window.createTeam=createTeam;window.editTeam=editTeam;window.delTeam=delTeam;
window.addMember=addMember;window.remMember=remMember;window.leaveTeam=leaveTeam;
window.setRole=setRole;
loadAll();
</script>
</body></html>
