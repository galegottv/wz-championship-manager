<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WZ Map Rotation Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#ff6a00;--red:#ff2d55;--green:#00ff87;--gold:#ffd700;--font:'Barlow Condensed',sans-serif;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:var(--font)}

#slides{position:relative;width:100%;height:100%}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;}
.slide.active{opacity:1;pointer-events:auto;}
.slide.entering{animation:wipeIn .55s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes wipeIn{from{opacity:0;clip-path:inset(100% 0 0 0);}to{opacity:1;clip-path:inset(0% 0 0 0);}}

.map-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:brightness(.52) saturate(1.15);
  transform:scale(1.06);transition:transform 22s linear;
}
.slide.active .map-bg{transform:scale(1.0);}

.map-overlay{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,.62) 100%),
    linear-gradient(to right, rgba(0,0,0,.88) 0%, transparent 36%, transparent 64%, rgba(0,0,0,.88) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.56) 0%, transparent 20%, transparent 68%, rgba(0,0,0,.94) 100%);
}

/* Bottom-left: map info */
.map-info{
  position:absolute;bottom:90px;left:80px;
  opacity:0;transform:translateY(22px);
}
.slide.active .map-info{animation:slideUp .5s .2s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes slideUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}

.drop-label{
  font-size:11px;font-weight:700;letter-spacing:6px;
  margin-bottom:10px;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.drop-label::before{content:'';display:block;width:22px;height:2px;}

.map-title{
  font-size:90px;font-weight:900;letter-spacing:-2px;
  line-height:.88;color:#fff;
  text-shadow:0 4px 60px rgba(0,0,0,.9);
  text-transform:uppercase;
}
.map-mode-badge{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:18px;border-radius:3px;padding:7px 18px;
  font-size:12px;font-weight:800;letter-spacing:4px;
  backdrop-filter:blur(8px);
}
.map-desc{
  margin-top:10px;font-size:15px;font-weight:600;
  letter-spacing:3px;color:rgba(255,255,255,.38);text-transform:uppercase;
}

/* Bottom-right: next map */
.next-wrap{
  position:absolute;bottom:90px;right:80px;text-align:right;
  opacity:0;
}
.slide.active .next-wrap{animation:fadeIn .5s .35s ease forwards;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.next-label{font-size:10px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.28);margin-bottom:6px;}
.next-name{font-size:22px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.48);}
.next-drop{font-size:11px;font-weight:700;letter-spacing:3px;margin-top:4px;}

/* Top-center: tourney */
.tourney-info{
  position:absolute;top:48px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;
  background:rgba(8,10,15,.78);border-radius:8px;padding:12px 30px;
  backdrop-filter:blur(14px);white-space:nowrap;
  border:1px solid rgba(255,255,255,.06);
  opacity:0;
}
.slide.active .tourney-info{animation:fadeIn .5s .1s ease forwards;}
.tourney-logo{width:30px;height:30px;filter:drop-shadow(0 0 8px var(--orange));}
.tourney-name{font-size:17px;font-weight:900;letter-spacing:4px;color:#fff;}
.tourney-sep{width:1px;height:26px;background:rgba(255,106,0,.25);}
.tourney-phase{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--orange);}

/* Top-left: drop counter */
.drop-counter{
  position:absolute;top:48px;left:80px;
  background:rgba(8,10,15,.82);border:1px solid rgba(255,255,255,.06);
  border-radius:8px;padding:12px 22px;opacity:0;
}
.slide.active .drop-counter{animation:fadeIn .5s .12s ease forwards;}
.dc-label{font-size:9px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.26);text-transform:uppercase;margin-bottom:4px;}
.dc-row{display:flex;align-items:baseline;gap:5px;}
.dc-num{font-size:38px;font-weight:900;line-height:1;}
.dc-sep{font-size:18px;font-weight:700;color:rgba(255,255,255,.18);}
.dc-total{font-size:18px;font-weight:700;color:rgba(255,255,255,.28);}

/* Top-right: live */
.live-badge{
  position:absolute;top:52px;right:80px;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,45,85,.16);border:1px solid rgba(255,45,85,.4);
  border-radius:3px;padding:8px 20px;
  font-size:12px;font-weight:800;letter-spacing:5px;color:#ff2d55;
  backdrop-filter:blur(6px);opacity:0;
}
.slide.active .live-badge{animation:fadeIn .5s .15s ease forwards;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff2d55;animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,45,85,.5)}55%{opacity:.3;box-shadow:0 0 0 9px rgba(255,45,85,0)}}

/* Bottom-center: map dots */
.map-dots{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;
}
.mdot{height:4px;border-radius:2px;transition:all .35s ease;background:rgba(255,255,255,.12);}
.mdot.done{background:rgba(0,255,135,.4);}
.mdot.active{background:var(--orange);width:32px!important;}

.scanlines{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.022) 2px,rgba(0,0,0,.022) 4px);}
.corner{position:absolute;width:34px;height:34px;z-index:50;}
.corner-tl{top:18px;left:18px;border-top:2px solid rgba(255,106,0,.35);border-left:2px solid rgba(255,106,0,.35);}
.corner-tr{top:18px;right:18px;border-top:2px solid rgba(255,106,0,.35);border-right:2px solid rgba(255,106,0,.35);}
.corner-bl{bottom:18px;left:18px;border-bottom:2px solid rgba(255,106,0,.35);border-left:2px solid rgba(255,106,0,.35);}
.corner-br{bottom:18px;right:18px;border-bottom:2px solid rgba(255,106,0,.35);border-right:2px solid rgba(255,106,0,.35);}

.drop-flash{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;background:rgba(255,106,0,.1);transition:opacity .08s;}
.drop-flash.on{opacity:1;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="drop-flash" id="drop-flash"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<div id="slides"></div>
<div class="map-dots" id="map-dots"></div>

<script>
// ════════════════════════════════════════════════════
//  WZ MAP OVERLAY — Controlado manualmente por quedas

  ],
};

// ══ localStorage keys ══
const LS_STATE  = 'wzc_state';
const LS_DROP   = 'wzc_drop_index';
const LS_MAP_ROT= 'wzc_map_rotation';

// Returns active map list: custom rotation if set, else ALL_MAPS fallback
// Maps from app.js rotation only have id/name/mode/ac — we enrich with img/fb from ALL_MAPS
function getActiveMaps(mode){
  try {
    const saved = JSON.parse(localStorage.getItem(LS_MAP_ROT)||'{}');
    if(saved[mode] && saved[mode].length > 0) {
      return saved[mode].map(m => {
        const full = (ALL_MAPS[mode]||[]).find(x=>x.id===m.id);
        return full ? {...m, ...full} : {
          ...m,
          img: m.id.startsWith('verd')||m.id==='verdansk' ? 'maps/verdansk.png'
              : m.id.startsWith('avl')||m.id==='avalon'   ? 'maps/avalon.png'
              : m.id.startsWith('hav')                    ? 'maps/havens_hollow.png'
              : 'maps/rebirth_island.png',
          fb:  'linear-gradient(135deg,#050a1e,#0a1640)',
          ac:  m.ac || '#ff6a00'
        };
      });
    }
  } catch {}
  return ALL_MAPS[mode] || ALL_MAPS.resurgence;
}

// ══ Estado ══
let currentIdx  = 0;
let currentMode = '';
let MAPS        = [];

// ══ Helpers ══
function getState() {
  try { const r = localStorage.getItem(LS_STATE); if(r) return JSON.parse(r); } catch {}
  return { name:'WZ CHAMPIONSHIP', phase:'MAP ROTATION', mode:'resurgence', isLive:true };
}
function getDropIdx() {
  const v = parseInt(localStorage.getItem(LS_DROP)||'0');
  return Math.max(0, Math.min(v, MAPS.length - 1));
}
function modeLabel(m) { return m === 'br' ? 'BATTLE ROYALE' : 'RESSURGENCIA'; }
function modeIcon(m)  { return m === 'br' ? '&#x1F4A5;' : '&#x1F504;'; }

// ══ Build Slides ══
function buildSlides(S) {
  const mode = S.mode || 'resurgence';
  MAPS = getActiveMaps(mode);
  currentMode = mode;
  dotsEl.innerHTML    = '';

  MAPS.forEach((m, i) => {
    const next = MAPS[(i + 1) % MAPS.length];
    const isLastMap = i === MAPS.length - 1;

    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = `slide-${i}`;
    slide.innerHTML = `
      <div class="map-bg" style="background-image:url('${m.img}'),${m.fb}"></div>
      <div class="map-overlay"></div>

      <div class="tourney-info">
        <svg class="tourney-logo" viewBox="0 0 60 60" fill="none">
          <polygon points="30,2 56,16 56,44 30,58 4,44 4,16" stroke="#ff6a00" stroke-width="2" fill="none"/>
          <circle cx="30" cy="30" r="10" stroke="#ff6a00" stroke-width="1.5" fill="none"/>
          <circle cx="30" cy="30" r="3" fill="#ff6a00"/>
        </svg>
        <span class="tourney-name" data-info="name">${(S.name||'WZ CHAMPIONSHIP').toUpperCase()}</span>
        <div class="tourney-sep"></div>
        <span class="tourney-phase" data-info="phase">${(S.phase||'MAP ROTATION').toUpperCase()}</span>
      </div>

      <div class="drop-counter">
        <div class="dc-label">QUEDA</div>
        <div class="dc-row">
          <span class="dc-num" style="color:${m.ac}">${String(i+1).padStart(2,'0')}</span>
          <span class="dc-sep">/</span>
          <span class="dc-total">${MAPS.length}</span>
        </div>
      </div>

      <div class="live-badge"><span class="live-dot"></span>AO VIVO</div>

      <div class="map-info">
        <div class="drop-label" style="color:${m.ac};">
          <span style="display:block;width:22px;height:2px;background:${m.ac};border-radius:1px"></span>
          QUEDA ${String(i+1).padStart(2,'0')} — ${modeLabel(mode)}
        </div>
        <div class="map-title" style="text-shadow:0 0 100px ${m.ac}44,0 4px 40px rgba(0,0,0,.9)">${m.name}</div>
        <div class="map-mode-badge" style="background:${m.ac}1a;border:1px solid ${m.ac}55;color:${m.ac}">
          ${modeIcon(mode)} ${modeLabel(mode)}
        </div>
        <div class="map-desc">${m.desc}</div>
      </div>

      <div class="next-wrap">
        ${!isLastMap ? `
          <div class="next-label">PRÓXIMA QUEDA</div>
          <div class="next-name">${next.name}</div>
          <div class="next-drop" style="color:${next.ac}88">QUEDA ${String(i+2).padStart(2,'0')}</div>
        ` : `
          <div class="next-label">ÚLTIMA QUEDA</div>
          <div class="next-name" style="color:var(--orange)">FIM DO CICLO</div>
        `}
      </div>
    `;
    container.appendChild(slide);

    // dot
    const dot = document.createElement('div');
    dot.className = 'mdot';
    dot.id = `mdot-${i}`;
    dot.style.width = '16px';
    dotsEl.appendChild(dot);
  });
}

// ── Ativar mapa ───────────────────────────────────────
function goTo(idx, animate) {
  if (!MAPS.length) return;
  idx = Math.max(0, Math.min(idx, MAPS.length - 1));
  currentIdx = idx;

  if (animate) {
    const fl = document.getElementById('drop-flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 200);
  }

  document.querySelectorAll('.slide').forEach((s, i) => {
    s.classList.remove('active','entering');
    if (i === idx) {
      if (animate) {
        s.classList.add('entering');
        setTimeout(() => { s.classList.remove('entering'); s.classList.add('active'); }, 550);
      } else {
        s.classList.add('active');
      }
    }
  });

  document.querySelectorAll('.mdot').forEach((d, i) => {
    d.classList.remove('done','active');
    d.style.width = '16px';
    if (i < idx)       { d.classList.add('done'); }
    else if (i === idx){ d.classList.add('active'); d.style.width = '32px'; }
  });
}

// ── Refresh tourney info ──────────────────────────────
function refreshInfo() {
  const S = getState();
  document.querySelectorAll('[data-info="name"]').forEach(el =>
    el.textContent = (S.name || 'WZ CHAMPIONSHIP').toUpperCase()
  );
  document.querySelectorAll('[data-info="phase"]').forEach(el =>
    el.textContent = (S.phase || 'MAP ROTATION').toUpperCase()
  );
}

// ── Watch localStorage (polling 300ms) ───────────────
let lastDropIdx  = -1;
let lastMode     = '';

function checkState() {
  const S   = getState();
  const mode = S.mode || 'resurgence';
  const idx  = Math.max(0, Math.min(parseInt(localStorage.getItem(LS_DROP)||'0'), (ALL_MAPS[mode]||[]).length - 1));

  // Modo mudou → rebuild completo
  if (mode !== lastMode) {
    lastMode    = mode;
    lastDropIdx = -1;
    buildSlides(S);
    goTo(idx, false);
    lastDropIdx = idx;
    return;
  }

  // Só o índice mudou
  if (idx !== lastDropIdx) {
    const animate = lastDropIdx >= 0;
    lastDropIdx = idx;
    goTo(idx, animate);
  }
}

// ── Init ─────────────────────────────────────────────
(function init() {
  const S    = getState();
  const mode = S.mode || 'resurgence';
  const idx  = parseInt(localStorage.getItem(LS_DROP)||'0');
  lastMode    = mode;
  lastDropIdx = idx;
  buildSlides(S);
  goTo(Math.max(0, Math.min(idx, MAPS.length-1)), false);
  setInterval(checkState,  300);
  setInterval(refreshInfo, 5000);
  window.addEventListener('storage', checkState);
})();
</script>
</body>
</html>
