<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WZ Map Rotation Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#ff6a00;--red:#ff2d55;--green:#00ff87;--gold:#ffd700;
  --font:'Barlow Condensed',sans-serif;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:var(--font)}

/* ─── SLIDE CONTAINER ─────────────────────────────── */
#slides{position:relative;width:100%;height:100%}
.slide{
  position:absolute;inset:0;
  opacity:0;
  pointer-events:none;
}
.slide.active{opacity:1;pointer-events:auto;}

/* ─── DROP TRANSITION WIPE ──────────────────────────
   Ao trocar de mapa, o novo slide aparece com wipe de baixo pra cima */
.slide{transition:opacity 0s;}
.slide.entering{
  animation: wipeIn .6s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes wipeIn{
  from{opacity:0;clip-path:inset(100% 0 0 0);}
  to{opacity:1;clip-path:inset(0% 0 0 0);}
}

/* ─── MAP BG ─────────────────────────────────────── */
.map-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:brightness(.55) saturate(1.1);
  transform:scale(1.05);
  transition:transform 20s linear;
}
.slide.active .map-bg{transform:scale(1.0);}

/* Cinematic vignette + gradient */
.map-overlay{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.6) 100%),
    linear-gradient(to right, rgba(0,0,0,.85) 0%, transparent 38%, transparent 62%, rgba(0,0,0,.85) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 22%, transparent 70%, rgba(0,0,0,.92) 100%);
}

/* ─── MAP INFO (bottom-left) ──────────────────────── */
.map-info{
  position:absolute;bottom:90px;left:80px;
  opacity:0;transform:translateY(24px);
}
.slide.active .map-info{
  animation: slideUp .5s .25s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.drop-label{
  font-size:11px;font-weight:700;letter-spacing:6px;color:var(--orange);
  margin-bottom:8px;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.drop-label::before{content:'';display:block;width:24px;height:2px;background:var(--orange);}

.map-title{
  font-size:88px;font-weight:900;letter-spacing:-2px;
  line-height:.9;color:#fff;
  text-shadow:0 4px 60px rgba(0,0,0,.9);
  text-transform:uppercase;
}
.map-mode-badge{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:16px;
  border-radius:3px;padding:7px 18px;
  font-size:12px;font-weight:800;letter-spacing:4px;
  backdrop-filter:blur(8px);
}
.map-desc{
  margin-top:10px;
  font-size:15px;font-weight:600;letter-spacing:3px;
  color:rgba(255,255,255,.4);text-transform:uppercase;
}

/* ─── NEXT MAP PREVIEW (bottom-right) ────────────── */
.next-map-preview{
  position:absolute;bottom:90px;right:80px;
  text-align:right;
  opacity:0;
}
.slide.active .next-map-preview{
  animation: fadeIn .5s .4s ease forwards;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.next-label{
  font-size:10px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.3);
  margin-bottom:6px;text-transform:uppercase;
}
.next-name{
  font-size:22px;font-weight:900;letter-spacing:1px;color:rgba(255,255,255,.5);
}
.next-drop-num{
  font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,106,0,.5);
  margin-top:4px;
}

/* ─── TOURNAMENT INFO (top-center) ───────────────── */
.tourney-info{
  position:absolute;top:48px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:20px;
  background:rgba(8,10,15,.78);
  border:1px solid rgba(255,106,0,.22);
  border-radius:8px;padding:12px 30px;
  backdrop-filter:blur(14px);
  white-space:nowrap;
  opacity:0;
}
.slide.active .tourney-info{animation:fadeIn .5s .1s ease forwards;}
.tourney-logo{width:30px;height:30px;filter:drop-shadow(0 0 8px var(--orange));}
.tourney-name{font-size:17px;font-weight:900;letter-spacing:4px;color:#fff;}
.tourney-sep{width:1px;height:26px;background:rgba(255,106,0,.25);}
.tourney-phase{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--orange);}

/* ─── LIVE BADGE (top-right) ─────────────────────── */
.live-badge{
  position:absolute;top:52px;right:80px;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,45,85,.18);border:1px solid rgba(255,45,85,.45);
  border-radius:3px;padding:8px 20px;
  font-size:12px;font-weight:800;letter-spacing:5px;color:#ff2d55;
  backdrop-filter:blur(6px);
  opacity:0;
}
.slide.active .live-badge{animation:fadeIn .5s .15s ease forwards;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff2d55;animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,45,85,.5)}55%{opacity:.35;box-shadow:0 0 0 9px rgba(255,45,85,0)}}

/* ─── DROP COUNTER (top-left) ────────────────────── */
.drop-counter{
  position:absolute;top:48px;left:80px;
  background:rgba(8,10,15,.82);
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:12px 22px;
  opacity:0;
}
.slide.active .drop-counter{animation:fadeIn .5s .12s ease forwards;}
.drop-counter-label{font-size:9px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.28);text-transform:uppercase;margin-bottom:4px;}
.drop-counter-row{display:flex;align-items:baseline;gap:6px;}
.drop-counter-num{font-size:36px;font-weight:900;line-height:1;}
.drop-counter-sep{font-size:18px;font-weight:700;color:rgba(255,255,255,.2);}
.drop-counter-total{font-size:18px;font-weight:700;color:rgba(255,255,255,.3);}

/* ─── MAP DOTS TRACKER (bottom-center) ───────────── */
.map-dots{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;
}
.mdot{
  height:4px;border-radius:2px;
  background:rgba(255,255,255,.15);
  transition:all .4s ease;
}
.mdot.done{background:rgba(0,255,135,.4);}
.mdot.active{background:var(--orange);width:32px!important;}
.mdot.upcoming{background:rgba(255,255,255,.1);}

/* ─── SCAN LINE EFFECT ──────────────────────────── */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
}
/* ─── CORNER MARKS ──────────────────────────────── */
.corner{position:absolute;width:36px;height:36px;z-index:50;}
.corner-tl{top:20px;left:20px;border-top:2px solid rgba(255,106,0,.4);border-left:2px solid rgba(255,106,0,.4);}
.corner-tr{top:20px;right:20px;border-top:2px solid rgba(255,106,0,.4);border-right:2px solid rgba(255,106,0,.4);}
.corner-bl{bottom:20px;left:20px;border-bottom:2px solid rgba(255,106,0,.4);border-left:2px solid rgba(255,106,0,.4);}
.corner-br{bottom:20px;right:20px;border-bottom:2px solid rgba(255,106,0,.4);border-right:2px solid rgba(255,106,0,.4);}

/* ─── DROP FLASH ─────────────────────────────────── */
.drop-flash{
  position:fixed;inset:0;pointer-events:none;z-index:999;
  opacity:0;background:linear-gradient(135deg, rgba(255,106,0,.12), rgba(255,45,85,.08));
  transition:opacity .08s;
}
.drop-flash.on{opacity:1;}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="drop-flash" id="drop-flash"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div id="slides"></div>
<div class="map-dots" id="map-dots"></div>

<script>
// ══════════════════════════════════════════════════════
//  WZ MAP OVERLAY — Modo MANUAL (controlado por drops)
//  Avança quando wzc_drop_index mudar no localStorage
// ══════════════════════════════════════════════════════

const LS_STATE = 'wzc_v3';
const LS_DROP  = 'wzc_drop_index'; // índice do mapa atual (0-based)

// ─── MAPS (use suas imagens reais se disponíveis) ────
const MAPS = [
  { id:'verdansk',  name:'Verdansk',        mode:'BATTLE ROYALE',  desc:'O mapa clássico — de volta à guerra',          img:'maps/verdansk.png',      fb:'linear-gradient(135deg,#0d1f0d,#1e3a10)',  ac:'#4caf50' },
  { id:'rebirth',   name:'Rebirth Island',  mode:'RESSURGÊNCIA',   desc:'A ilha da ressurgência — ação não para',       img:'maps/rebirth_island.png', fb:'linear-gradient(135deg,#0a0d1e,#0f1e40)',  ac:'#2196f3' },
  { id:'avalon',    name:'Avalon',          mode:'BATTLE ROYALE',  desc:'Novo território — Season 3 2026',              img:'maps/avalon.png',         fb:'linear-gradient(135deg,#1e0d0a,#3a1a08)',  ac:'#ff9800' },
  { id:'haven',     name:"Haven's Hollow",  mode:'RESSURGÊNCIA',   desc:'A nova arena — Season 1 BO7',                  img:'maps/havens_hollow.png',  fb:'linear-gradient(135deg,#100a1e,#200a3e)',  ac:'#9c27b0' },
  { id:'verd2',     name:'Verdansk Norte',  mode:'BATTLE ROYALE',  desc:'Zona norte — confronto final',                 img:'maps/verdansk.png',       fb:'linear-gradient(135deg,#08140a,#122806)',  ac:'#66bb6a' },
  { id:'reb2',      name:'Rebirth Praia',   mode:'RESSURGÊNCIA',   desc:'Costa leste — posições privilegiadas',         img:'maps/rebirth_island.png', fb:'linear-gradient(135deg,#050a1e,#081840)',  ac:'#42a5f5' },
  { id:'avl2',      name:'Avalon Centro',   mode:'BATTLE ROYALE',  desc:'Zona urbana — batalha intensa',                img:'maps/avalon.png',         fb:'linear-gradient(135deg,#1e0a06,#3e1c08)',  ac:'#ffa726' },
  { id:'hav2',      name:"Haven's Vale",    mode:'RESSURGÊNCIA',   desc:'Vale profundo — emboscadas inevitáveis',       img:'maps/havens_hollow.png',  fb:'linear-gradient(135deg,#100618,#22083a)',  ac:'#ab47bc' },
  { id:'verd3',     name:'Verdansk Sul',    mode:'BATTLE ROYALE',  desc:'Zona industrial — campo aberto',               img:'maps/verdansk.png',       fb:'linear-gradient(135deg,#060e06,#101a08)',  ac:'#81c784' },
  { id:'reb3',      name:'Rebirth Topo',    mode:'RESSURGÊNCIA',   desc:'Altitude máxima — visão total do campo',       img:'maps/rebirth_island.png', fb:'linear-gradient(135deg,#04061a,#080e30)',  ac:'#64b5f6' },
];

let currentIdx = 0;

// ─── UTIL ─────────────────────────────────────────────
function getState() {
  try { const r = localStorage.getItem(LS_STATE); if(r) return JSON.parse(r); } catch {}
  return { name:'WZ CHAMPIONSHIP', phase:'MAP ROTATION', isLive:true };
}
function getDropIdx() {
  const v = localStorage.getItem(LS_DROP);
  return v !== null ? Math.max(0, Math.min(parseInt(v)||0, MAPS.length-1)) : 0;
}

// ─── BUILD SLIDES ──────────────────────────────────────
function buildSlides() {
  const S = getState();
  const container = document.getElementById('slides');
  const dotsEl    = document.getElementById('map-dots');
  container.innerHTML = '';
  dotsEl.innerHTML = '';

  MAPS.forEach((m, i) => {
    const next = MAPS[(i + 1) % MAPS.length];
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = `slide-${i}`;
    slide.innerHTML = `
      <div class="map-bg" style="background-image:url('${m.img}'),${m.fb}"></div>
      <div class="map-overlay"></div>

      <!-- Top center: tourney info -->
      <div class="tourney-info">
        <svg class="tourney-logo" viewBox="0 0 60 60" fill="none">
          <polygon points="30,2 56,16 56,44 30,58 4,44 4,16" stroke="#ff6a00" stroke-width="2" fill="none"/>
          <circle cx="30" cy="30" r="10" stroke="#ff6a00" stroke-width="1.5" fill="none"/>
          <circle cx="30" cy="30" r="3" fill="#ff6a00"/>
        </svg>
        <span class="tourney-name" data-info="name">${(S.name||'WZ CHAMPIONSHIP').toUpperCase()}</span>
        <div class="tourney-sep"></div>
        <span class="tourney-phase" data-info="phase">${(S.phase||'MAP ROTATION').toUpperCase()}</span>
      </div>

      <!-- Top left: drop counter -->
      <div class="drop-counter">
        <div class="drop-counter-label">QUEDA</div>
        <div class="drop-counter-row">
          <span class="drop-counter-num" style="color:${m.ac}">${String(i+1).padStart(2,'0')}</span>
          <span class="drop-counter-sep">/</span>
          <span class="drop-counter-total">${MAPS.length}</span>
        </div>
      </div>

      <!-- Top right: live -->
      <div class="live-badge"><span class="live-dot"></span>AO VIVO</div>

      <!-- Bottom left: map name -->
      <div class="map-info">
        <div class="drop-label">QUEDA ${String(i+1).padStart(2,'0')}</div>
        <div class="map-title" style="text-shadow:0 0 100px ${m.ac}55,0 4px 40px rgba(0,0,0,.9)">${m.name}</div>
        <div class="map-mode-badge" style="background:${m.ac}20;border:1px solid ${m.ac}55;color:${m.ac}">
          ${m.mode === 'BATTLE ROYALE' ? '💀' : '🔄'} ${m.mode}
        </div>
        <div class="map-desc">${m.desc}</div>
      </div>

      <!-- Bottom right: next drop preview -->
      <div class="next-map-preview">
        <div class="next-label">PRÓXIMA QUEDA</div>
        <div class="next-name">${next.name}</div>
        <div class="next-drop-num">QUEDA ${String((i+2)>MAPS.length?1:i+2).padStart(2,'0')}</div>
      </div>
    `;
    container.appendChild(slide);

    // dot
    const dot = document.createElement('div');
    dot.className = 'mdot upcoming';
    dot.id = `mdot-${i}`;
    dot.style.width = '16px';
    dotsEl.appendChild(dot);
  });
}

// ─── ACTIVATE MAP ──────────────────────────────────────
function goTo(idx, animate) {
  idx = Math.max(0, Math.min(idx, MAPS.length - 1));
  currentIdx = idx;

  // Flash
  if (animate) {
    const fl = document.getElementById('drop-flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 200);
  }

  // Slides
  document.querySelectorAll('.slide').forEach((s, i) => {
    s.classList.remove('active', 'entering');
    if (i === idx) {
      if (animate) {
        s.classList.add('entering');
        setTimeout(() => { s.classList.remove('entering'); s.classList.add('active'); }, 600);
      } else {
        s.classList.add('active');
      }
    }
  });

  // Dots
  document.querySelectorAll('.mdot').forEach((d, i) => {
    d.classList.remove('done','active','upcoming');
    if (i < idx)       d.classList.add('done');
    else if (i === idx){ d.classList.add('active'); d.style.width='32px'; }
    else               { d.classList.add('upcoming'); d.style.width='16px'; }
  });

  // Update tourney info
  refreshInfo();
}

// ─── REFRESH TOURNEY INFO ──────────────────────────────
function refreshInfo() {
  const S = getState();
  document.querySelectorAll('[data-info="name"]').forEach(el =>
    el.textContent = (S.name || 'WZ CHAMPIONSHIP').toUpperCase()
  );
  document.querySelectorAll('[data-info="phase"]').forEach(el =>
    el.textContent = (S.phase || 'MAP ROTATION').toUpperCase()
  );
}

// ─── WATCH LOCALSTORAGE ────────────────────────────────
// Polling (localStorage não dispara storageEvent na mesma tab)
let lastDropIdx = -1;
function checkDrop() {
  const idx = getDropIdx();
  if (idx !== lastDropIdx) {
    lastDropIdx = idx;
    goTo(idx, lastDropIdx >= 0); // animate on change except first load
  }
}

// ─── INIT ──────────────────────────────────────────────
buildSlides();
const initIdx = getDropIdx();
lastDropIdx = initIdx;
goTo(initIdx, false);

// Poll for changes
setInterval(checkDrop, 300);
// Also refresh info periodically
setInterval(refreshInfo, 5000);

// Listen for storage events from other tabs/windows
window.addEventListener('storage', (e) => {
  if (e.key === LS_DROP) checkDrop();
});
</script>
</body>
</html>
